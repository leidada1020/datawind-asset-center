<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据集详情 - DataWind 资产中心</title>
<style>
:root{--main:#1a6d8a;--bg:#f5f7fa;--card:#fff;--line:#e2e8f0;--text:#1f2329;--sub:#646a73;--accent:#d97706;
  --c-mv:#2b6cb0;--c-ods:#2f855a;--c-dwd:#805ad5;--c-dim:#319795;--c-dws:#c05621;--c-ads:#c53030;
  --c-tmp:#718096;--c-fin:#234e70;--c-other:#8a7b60;--c-dataset:#1a6d8a;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);}
header{background:#fff;border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:24px;}
header h1{font-size:18px;color:var(--main);}
header nav a{color:var(--sub);text-decoration:none;margin-right:16px;font-size:14px;}
header nav a.active,header nav a:hover{color:var(--main);border-bottom:2px solid var(--main);}
header .dt{font-size:13px;color:var(--sub);margin-left:auto;}
main{padding:20px 24px;max-width:1440px;margin:0 auto;}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 20px;margin-bottom:20px;}
.panel h2{font-size:15px;margin-bottom:12px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{background:#f0f4f7;color:var(--sub);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
pre{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:8px;font-size:12px;overflow-x:auto;white-space:pre-wrap;word-break:break-all;}
.conf{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;}
.conf.high{background:#e6f4ea;color:#1a7f37;}
.conf.medium{background:#fdf0e3;color:#b45309;}
.conf.pending{background:#f0f4f7;color:#64748b;}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;font-size:13px;}
.kv .k{color:var(--sub);font-size:12px;}
.kv .v{font-weight:500;word-break:break-all;}
#lineage-svg-wrap{overflow-x:auto;}
#lineage-svg-wrap svg{width:100%;height:auto;min-width:760px;}
.legend{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--sub);margin-bottom:10px;}
.legend .item{display:flex;align-items:center;gap:5px;}
.legend .dot{width:12px;height:12px;border-radius:3px;display:inline-block;}
.legend .dot.round{border-radius:50%;}
.tips{font-size:12px;color:var(--sub);}
.changes li{list-style:none;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px;}
.changes .t{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;background:#f0f4f7;color:#475569;}
.changes .t.added{background:#e6f4ea;color:#1a7f37;}
.changes .t.deleted{background:#fde8e8;color:#c0392b;}
.changes .t.config_changed{background:#fdf0e3;color:#b45309;}
.changes .t.upstream_changed{background:#e0f2fe;color:#0369a1;}
.changes .t.logic_changed{background:#fff3e0;color:#e65100;}
.changes .t.source_changed{background:#fce4ec;color:#c2185b;}
.badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;background:#e8f0f4;color:var(--main);}
.badge.ok{background:#e6f4ea;color:#1a7f37;}
.badge.warn{background:#fdf0e3;color:#b45309;}
.badge.bad{background:#fde8e8;color:#c0392b;}
.tl-date{font-size:12.5px;color:var(--sub);font-weight:600;padding:10px 0 2px;border-bottom:1px solid var(--line);margin-top:4px;}
.timeline{list-style:none;position:relative;margin:0;padding:6px 0 0 20px;}
.timeline:before{content:'';position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:#dbe3ea;}
.timeline li{position:relative;padding:7px 0 7px 12px;font-size:13px;}
.timeline li:before{content:'';position:absolute;left:-20px;top:14px;width:9px;height:9px;border-radius:50%;background:var(--main);border:2px solid #fff;box-shadow:0 0 0 1px var(--main);}
.timeline li .tm{color:var(--sub);font-size:12px;margin-left:6px;}
a{color:var(--main);text-decoration:none;} a:hover{text-decoration:underline;}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--sub);padding:40px;font-size:14px;}
.spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--main);border-radius:50%;animation:rot .8s linear infinite;flex-shrink:0;}
@keyframes rot{to{transform:rotate(360deg);}}
.err-box{text-align:center;padding:40px;color:#c0392b;font-size:14px;}
.err-box button{margin-left:8px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 16px;cursor:pointer;color:var(--sub);}
.err-box button:hover{color:var(--main);border-color:var(--main);}
.back-bar{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.back-bar a.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--main);
  border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 12px;text-decoration:none;}
.back-bar a.back:hover{border-color:var(--main);text-decoration:none;}
.back-bar .crumb{font-size:13px;color:var(--sub);}
.back-bar .crumb a{color:var(--main);text-decoration:none;}
.back-bar .crumb a:hover{text-decoration:underline;}
.back-bar .crumb b{color:var(--text);font-weight:500;}
.layout{display:flex;gap:20px;align-items:flex-start;}
.layout main{flex:1;min-width:0;max-width:1440px;}
.side{width:300px;flex-shrink:0;background:var(--card);border:1px solid var(--line);border-radius:8px;
  padding:14px;position:sticky;top:14px;max-height:calc(100vh - 40px);overflow-y:auto;}
.side h2{font-size:14px;margin-bottom:10px;}
.modes{display:flex;gap:6px;margin-bottom:10px;}
.modes button{flex:1;border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 0;
  cursor:pointer;font-size:13px;color:var(--sub);}
.modes button.active{background:var(--main);border-color:var(--main);color:#fff;}
.sbar{display:flex;gap:6px;margin-bottom:10px;}
.sbar input{flex:1;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;min-width:0;}
.sbar button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 12px;
  cursor:pointer;font-size:13px;color:var(--sub);white-space:nowrap;}
.sbar button:hover{color:var(--main);border-color:var(--main);}
.tree{font-size:13px;}
.tnode{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:5px;cursor:pointer;color:var(--text);}
.tnode:hover{background:#f0f7fa;}
.tnode.sel{background:#e6f2f8;color:var(--main);font-weight:600;}
.tnode .tw{width:10px;color:var(--sub);font-size:11px;flex-shrink:0;}
.tnode .dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.tnode .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tnode .cnt{margin-left:auto;color:var(--sub);font-size:11px;flex-shrink:0;}
.tchildren{margin-left:14px;border-left:1px dashed var(--line);padding-left:6px;}
.side .empty{color:var(--sub);font-size:13px;padding:14px;}
.sres{font-size:13px;}
.sres .tt{color:var(--sub);font-size:12px;margin:6px 0 4px;}
</style>
</head>
<body>
<header>
  <h1>DataWind 资产中心</h1>
  <nav><a href="/" class="active">资产目录</a><a href="/lineage">血缘查询</a><a href="/changes">变更监控</a></nav>
  <span class="dt" id="title"><span class="spin" style="width:12px;height:12px;vertical-align:-2px"></span> 加载中...</span>
</header>
<div class="layout">
<aside class="side">
  <h2>资产导航</h2>
  <div class="modes">
    <button id="mLayer" class="active" onclick="switchMode('layer')">数仓分层</button>
    <button id="mFolder" onclick="switchMode('folder')">数据集目录</button>
  </div>
  <div class="sbar">
    <input id="kw" placeholder="搜索数据集名称/ID">
    <button onclick="doSearch()">搜索</button>
  </div>
  <div id="treeWrap">
    <div class="tree" id="tree"><div class="loading"><span class="spin"></span>正在加载资产导航...</div></div>
  </div>
  <div class="sres" id="searchRes" style="display:none"></div>
</aside>
<main id="main"><div class="loading"><span class="spin"></span>正在加载数据集详情...</div></main>
</div>
<script>
const $ = id => document.getElementById(id);
const LAYER_ORDER = ['mv','ods','dwd','dim','dws','ads','tmp','fin','other'];
const LAYER_COLOR = {mv:'#2b6cb0',ods:'#2f855a',dwd:'#805ad5',dim:'#319795',dws:'#c05621',ads:'#c53030',tmp:'#718096',fin:'#234e70',other:'#8a7b60'};
const DCOLOR = '#d97706';
function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function trim(s, n){ return String(s).length > n ? String(s).slice(0, n) + '…' : s; }
function errHtml(msg){ return `<div class="err-box">加载失败: ${esc(msg)} <button onclick="location.reload()">重试</button></div>`; }
async function j(url){ const r = await fetch(url); return r.json(); }
function getDsid(){ return parseInt(location.pathname.split('/')[2]) || 0; }

/* ---------------- 左侧资产导航(树 + 搜索), 点击直接切换详情 ---------------- */
let mode = 'layer', layerTree = [], folderTree = [];
let openLayer = '', openDb = '', openFolder = '', curDsid = 0;
const dbCache = {}, folderCache = {};

async function loadTrees(){
  $('tree').innerHTML = '<div class="loading"><span class="spin"></span>正在加载资产导航...</div>';
  try {
    const [l, f] = await Promise.all([j('/api/doris/layers'), j('/api/folder_tree')]);
    layerTree = l; folderTree = f;
    renderTree();
  } catch(e){ $('tree').innerHTML = errHtml(e.message); }
}

function renderTree(){
  const t = $('tree');
  if (mode === 'layer'){
    const byLayer = {};
    layerTree.forEach(x => (byLayer[x.layer] = byLayer[x.layer] || []).push(x));
    const layers = LAYER_ORDER.filter(l => byLayer[l]).concat(
      Object.keys(byLayer).filter(l => !LAYER_ORDER.includes(l)).sort());
    let h = '';
    layers.forEach(l => {
      const dbs = byLayer[l].sort((a,b) => a.db.localeCompare(b.db));
      const cnt = dbs.reduce((s,x) => s + x.cnt, 0);
      h += `<div class="tnode" onclick="toggleLayer('${l}')">
        <span class="tw">${openLayer === l ? '▾' : '▸'}</span>
        <span class="dot" style="background:${LAYER_COLOR[l] || '#8a7b60'}"></span>
        <span class="nm">${esc(l)}</span><span class="cnt">${cnt}</span></div>`;
      if (openLayer === l){
        h += '<div class="tchildren">' + dbs.map(x =>
          `<div class="tnode" onclick="toggleDb('${esc(x.db)}')">
            <span class="tw">${openDb === x.db ? '▾' : '▸'}</span>
            <span class="nm">${esc(x.db)}</span><span class="cnt">${x.cnt}</span></div>
           ${openDb === x.db ? '<div class="tchildren" data-db="' + esc(x.db) + '"><div class="loading" style="padding:8px"><span class="spin"></span></div></div>' : ''}`).join('') + '</div>';
      }
    });
    t.innerHTML = h || '<div class="empty">暂无分层数据</div>';
    if (openDb) fillDbTables(openDb);
  } else {
    const byId = {}; folderTree.items.forEach(f => byId[f.id] = f);
    const kids = id => folderTree.items.filter(f => f.parent === id);
    const rootKids = folderTree.items.filter(f => !f.parent || f.parent === 0 || f.parent === null);
    function nodeHtml(f){
      const children = kids(f.id);
      const open = openFolder === f.path;
      return `<div class="tnode" onclick="toggleFolder('${esc(f.path)}')">
          <span class="tw">${children.length ? (open ? '▾' : '▸') : ''}</span>
          <span class="nm">${esc(f.name)}</span><span class="cnt">${f.cnt || ''}</span></div>
        ${open ? '<div class="tchildren" data-folder="' + esc(f.path) + '"><div class="loading" style="padding:8px"><span class="spin"></span></div></div>' : ''}`;
    }
    const allOpen = openFolder === '';
    let h = `<div class="tnode ${allOpen ? 'sel' : ''}" onclick="toggleFolder('')">
      <span class="tw">${allOpen ? '▾' : '▸'}</span><span class="nm">全部数据集</span>
      <span class="cnt">${folderTree.total || ''}</span></div>
      ${allOpen ? '<div class="tchildren" data-folder=""><div class="loading" style="padding:8px"><span class="spin"></span></div></div>' : ''}`;
    h += rootKids.map(nodeHtml).join('');
    t.innerHTML = h;
    // 懒加载已展开的数据集列表
    const box = t.querySelector('[data-folder="' + CSS.escape(openFolder) + '"]');
    if (box && !box.dataset.loaded) fillFolderDatasets(openFolder, box);
  }
}

async function fillDbTables(db){
  const box = document.querySelector('#tree [data-db="' + CSS.escape(db) + '"]');
  if (!box || box.dataset.loaded) return;
  box.dataset.loaded = '1';
  if (dbCache[db] != null){ box.innerHTML = dbCache[db]; return; }
  try {
    const d = await j('/api/doris/tables?db=' + encodeURIComponent(db) + '&size=1000');
    dbCache[db] = (d.items || []).map(x =>
      `<div class="tnode" onclick="location='/lineage?node=' + encodeURIComponent('${esc(x.db)}.${esc(x.table)}')">
        <span class="tw"></span><span class="nm">${esc(x.table)}</span><span class="cnt">${x.rows ?? ''}</span></div>`).join('')
      || '<div class="empty">无表</div>';
    box.innerHTML = dbCache[db];
  } catch(e){ box.innerHTML = '<div class="empty">加载失败</div>'; }
}

async function fillFolderDatasets(p, box){
  if (box.dataset.loaded) return;
  box.dataset.loaded = '1';
  if (folderCache[p] != null){ box.innerHTML = folderCache[p]; return; }
  try {
    const d = await j('/api/datasets?folder=' + encodeURIComponent(p) + '&size=500');
    if (d.error) throw new Error(d.error);
    folderCache[p] = (d.items || []).map(x =>
      `<div class="tnode ${x.dataset_id === curDsid ? 'sel' : ''}" onclick="loadDetail(${x.dataset_id})">
        <span class="tw"></span><span class="nm">${esc(x.name)}</span><span class="cnt">${x.dataset_id}</span></div>`).join('')
      || '<div class="empty">无数据集</div>';
    box.innerHTML = folderCache[p];
  } catch(e){ box.innerHTML = '<div class="empty">加载失败</div>'; }
}

function toggleLayer(l){
  openLayer = openLayer === l ? '' : l; openDb = '';
  renderTree();
}
function toggleDb(db){
  openLayer = openLayer;
  openDb = openDb === db ? '' : db;
  renderTree();
}
function toggleFolder(p){
  openFolder = openFolder === p ? '' : p;
  renderTree();
}
function switchMode(m){
  mode = m; openLayer = ''; openDb = ''; openFolder = '';
  $('mLayer').classList.toggle('active', m === 'layer');
  $('mFolder').classList.toggle('active', m === 'folder');
  renderTree();
}

async function doSearch(){
  const kw = $('kw').value.trim();
  const box = $('searchRes');
  if (!kw){ box.style.display = 'none'; $('treeWrap').style.display = ''; return; }
  $('treeWrap').style.display = 'none';
  box.style.display = '';
  box.innerHTML = '<div class="loading" style="padding:16px"><span class="spin"></span>正在搜索...</div>';
  try {
    const d = await j('/api/datasets?keyword=' + encodeURIComponent(kw) + '&size=50');
    if (d.error) throw new Error(d.error);
    box.innerHTML = '<div class="tt">搜索结果 (共 ' + d.total + '):</div>' +
      (d.items || []).map(x =>
        `<div class="tnode ${x.dataset_id === curDsid ? 'sel' : ''}" data-id="${x.dataset_id}" onclick="loadDetail(${x.dataset_id})">
          <span class="tw"></span><span class="nm">${esc(x.name)}</span><span class="cnt">${x.dataset_id}</span></div>`).join('')
      || '<div class="empty">无匹配数据集</div>';
  } catch(e){ box.innerHTML = errHtml(e.message); }
}
$('kw').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

/* ---------------- 树状血缘图: 数据集(右) <- hop1直接上游(中) <- hop2调度生产来源(左) ---------------- */
function renderLineageTree(t){
  const ups = (t && t.upstream) || [];
  if (!ups.length) return '<div class="empty">该数据集无解析到的上游表（直连/无加工SQL）</div>';
  // 列定义: 2=调度来源(hop2), 1=直接上游(hop1), 0=数据集
  const colCx = {2:180, 1:500, 0:830}, colW = {2:280, 1:280, 0:220};
  const NODE_H = 30, DS_H = 52, TOP = 34, PAD = 60, YMIN = 58, W = 960;
  const layerOf = db => LAYER_COLOR[db] || LAYER_COLOR.other;
  const nodeW = tb => Math.max(110, Math.min(250, (tb || '').length * 7.2 + 22));

  // hop1 节点集合 + hop2 节点集合(去重)
  const hop1 = ups.map(u => ({db: u.db || '', table: u.table, srcs: u.srcs || []}));
  const hop2Map = {};
  hop1.forEach(u => (u.srcs || []).forEach(s => {
    const k = (s.db || '') + '\u0001' + (s.table || '');
    if (!(k in hop2Map)) hop2Map[k] = {db: s.db || '', table: s.table || '', parents: []};
    hop2Map[k].parents.push(u);
  }));
  const hop2 = Object.values(hop2Map);

  // 布局: 列内垂直均分
  const colH = {2: hop2.length * YMIN, 1: hop1.length * YMIN, 0: 1 * YMIN};
  const H = Math.max(colH[2], colH[1], colH[0]) + TOP + PAD;
  const pos = {};
  function placeCol(layer, arr, h){
    arr.forEach((nd, i) => {
      pos[layer + ':' + i] = { x: colCx[layer], y: TOP + (h - arr.length * YMIN) / 2 + i * YMIN + (layer === 0 ? DS_H / 2 : NODE_H / 2) };
    });
  }
  placeCol(2, hop2, colH[2]); placeCol(1, hop1, colH[1]); placeCol(0, [{name: t.name}], colH[0]);

  let svg = '';
  svg += '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">';
  svg += '<defs><marker id="arr" viewBox="0 0 10 10" refX="15" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>';

  // 层带 + 层标签
  [['2', '#eef4fb', '↑ 调度生产来源 (hop2)'], ['1', '#f3fbf5', '↑ 直接上游 (hop1)'], ['0', '#fff7e8', '★ 数据集']].forEach(([k, color, label]) => {
    const x0 = colCx[k] - colW[k] / 2;
    svg += '<rect x="' + x0 + '" y="8" width="' + colW[k] + '" height="' + (H - 16) + '" rx="10" fill="' + color + '" opacity="0.5"/>';
    svg += '<text x="' + colCx[k] + '" y="' + (H - 20) + '" text-anchor="middle" font-size="11.5" font-weight="600" fill="#64748b">' + label + '</text>';
  });

  // 边: hop2 -> hop1 -> 数据集 (数据流向从左到右)
  hop2.forEach((nd, i) => {
    const a = pos['2:' + i];
    nd.parents.forEach(p => {
      const pi = hop1.findIndex(x => x === p);
      const b = pos['1:' + pi];
      const x1 = a.x + nodeW(nd.table) / 2, y1 = a.y;
      const x2 = b.x - nodeW(p.table) / 2, y2 = b.y;
      const dx = Math.max(36, (x2 - x1) * 0.5);
      svg += '<path d="M ' + x1 + ' ' + y1 + ' C ' + (x1 + dx) + ' ' + y1 + ', ' + (x2 - dx) + ' ' + y2 + ', ' + x2 + ' ' + y2 + '" fill="none" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)"/>';
    });
  });
  hop1.forEach((nd, i) => {
    const a = pos['1:' + i], b = pos['0:0'];
    const x1 = a.x + nodeW(nd.table) / 2, y1 = a.y;
    const x2 = b.x - 110, y2 = b.y;
    const dx = Math.max(30, (x2 - x1) * 0.5);
    svg += '<path d="M ' + x1 + ' ' + y1 + ' C ' + (x1 + dx) + ' ' + y1 + ', ' + (x2 - dx) + ' ' + y2 + ', ' + x2 + ' ' + y2 + '" fill="none" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)"/>';
  });

  // 节点: hop2
  hop2.forEach((nd, i) => {
    const p = pos['2:' + i], c = layerOf(nd.db), w = nodeW(nd.table);
    const disp = nd.table.length > 24 ? nd.table.slice(0, 24) + '…' : nd.table;
    svg += '<g class="lnode" data-q="' + esc(nd.db) + '.' + esc(nd.table) + '" style="cursor:pointer">' +
      '<rect x="' + (p.x - w / 2) + '" y="' + (p.y - NODE_H / 2) + '" width="' + w + '" height="' + NODE_H + '" rx="6" fill="' + c + '" fill-opacity="0.12" stroke="' + c + '" stroke-width="1.3"/>' +
      '<text x="' + p.x + '" y="' + (p.y + 4) + '" text-anchor="middle" font-size="11" fill="' + c + '" font-weight="600">' + esc(disp) + '</text>' +
      '<title>' + esc(nd.db) + '.' + esc(nd.table) + '（hop2 调度生产来源）</title></g>';
  });
  // 节点: hop1
  hop1.forEach((nd, i) => {
    const p = pos['1:' + i], c = layerOf(nd.db), w = nodeW(nd.table);
    const disp = nd.table.length > 24 ? nd.table.slice(0, 24) + '…' : nd.table;
    svg += '<g class="lnode" data-q="' + esc(nd.db) + '.' + esc(nd.table) + '" style="cursor:pointer">' +
      '<rect x="' + (p.x - w / 2) + '" y="' + (p.y - NODE_H / 2) + '" width="' + w + '" height="' + NODE_H + '" rx="6" fill="' + c + '" fill-opacity="0.16" stroke="' + c + '" stroke-width="1.6"/>' +
      '<text x="' + p.x + '" y="' + (p.y + 4) + '" text-anchor="middle" font-size="11" fill="' + c + '" font-weight="600">' + esc(disp) + '</text>' +
      '<title>' + esc(nd.db) + '.' + esc(nd.table) + '（hop1 直接上游）</title></g>';
  });
  // 节点: 数据集(右端, 橙色)
  const dp = pos['0:0'];
  const dispName = t.name.length > 10 ? t.name.slice(0, 10) + '…' : t.name;
  svg += '<g>' +
    '<rect x="' + (dp.x - 110) + '" y="' + (dp.y - DS_H / 2) + '" width="220" height="' + DS_H + '" rx="10" fill="' + DCOLOR + '" fill-opacity="0.1" stroke="' + DCOLOR + '" stroke-width="2"/>' +
    '<text x="' + dp.x + '" y="' + (dp.y + 2) + '" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b45309">' + esc(dispName) + '</text>' +
    '<text x="' + dp.x + '" y="' + (dp.y + 22) + '" text-anchor="middle" font-size="10" fill="#8a6d3b">数据集 #' + t.dataset_id + '</text></g>';

  svg += '</svg>';
  return svg;
}

// 点击血缘图中的表节点 -> 打开完整血缘
document.addEventListener('click', ev => {
  const g = ev.target.closest('.lnode'); if (!g) return;
  window.open('/lineage?node=' + encodeURIComponent(g.dataset.q), '_blank');
});
// 点击搜索结果节点 -> 切换详情（事件委托, 兼容内联 onclick 失效场景）
document.addEventListener('click', ev => {
  const t = ev.target.closest('.tnode'); if (!t) return;
  const id = t.getAttribute('data-id'); if (!id) return;
  if (typeof loadDetail === 'function') { ev.preventDefault(); loadDetail(Number(id)); }
});

async function loadDetail(dsid){
  // 即时加载反馈, 避免点击后看起来无反应
  $('main').innerHTML = '<div class="loading" style="padding:40px"><span class="spin"></span>正在加载数据集详情...</div>';
  let d;
  try {
    const r = await fetch('/api/datasets/' + dsid);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    d = await r.json();
    if (d.error) throw new Error(d.error);
  } catch(e){
    $('main').innerHTML = `<div class="err-box">加载失败: ${esc(e.message)}
      <button onclick="location.reload()">重试</button></div>`;
    $('title').textContent = '加载失败';
    return;
  }
  $('title').textContent = `${esc(d.name)} (${d.dataset_id})`;

  // 树状表级血缘(hop1 + DS调度生产来源 hop2)
  const treeSvg = renderLineageTree(d.lineage_tree);
  const hop2Cnt = ((d.lineage_tree || {}).upstream || []).reduce((a, u) => a + ((u.srcs || []).length), 0);

  // 字段级血缘表
  const fl = d.field_lineage || [];
  const flRows = fl.map(f => {
    const biz = f.business && f.business !== f.target ? f.business + ' (' + f.target + ')' : (f.target || '');
    return `<tr><td>${esc(biz)}</td><td>${esc(f.src_table)}</td><td>${esc(f.src_field)}</td>
    <td><span class="conf ${f.conf}">${f.conf}</span></td></tr>`;
  }).join('') ||
    '<tr><td colspan="4" class="empty">无字段级血缘</td></tr>';

  // 字段清单
  const flds = (d.fields || []).map(f => `<tr><td>${esc(f.name)}</td><td>${esc(f.business)}</td><td>${esc(f.type)}</td></tr>`).join('') ||
    '<tr><td colspan="3" class="empty">无字段清单（直连数据集）</td></tr>';

  // 变更时间线: 按业务日期分组, 时间轴样式(参考 DataHub version history)
  const _ch = d.change_history || [];
  const chGroups = {};
  _ch.forEach(c => {
    const t = c.mtime || (c.etl_time ? String(c.etl_time).replace('T',' ') : '');
    (chGroups[c.dt] = chGroups[c.dt] || []).push(Object.assign({t}, c));
  });
  const ch = Object.keys(chGroups).sort((a,b) => b.localeCompare(a)).map(dt =>
    `<div class="tl-date">${esc(dt)} · ${chGroups[dt].length} 条变更</div><ul class="timeline">` +
    chGroups[dt].map(c => `<li>
    <span class="t ${c.type}">${esc(c.type_name)}</span>
    ${c.t ? '<span class="tm">' + esc(String(c.t).slice(11,16)) + '</span>' : ''}
    <div style="margin-top:2px;">
      ${c.summary ? '<span style="color:var(--main)">' + esc(c.summary) + '</span>' : (c.fields ? '字段: ' + esc(c.fields) : '')}
      ${c.remark ? '<span style="color:var(--sub)">(' + esc(c.remark) + ')</span>' : ''}
    </div>
  </li>`).join('') + '</ul>').join('') ||
    '<div class="empty">暂无变更历史</div>';

  // 维度指标(dimMet): 指标(variety=2)为聚合列, 维度(variety=1)为分组列, 普通字段(variety=0)为模型字段
  const mds = d.metric_defs || [];
  const mItems = mds.filter(m => m.variety === 2);
  const dItems = mds.filter(m => m.variety === 1);
  const fItems = mds.filter(m => m.variety === 0);
  const metRow = m => `<tr><td>${esc(m.name)}</td><td>${esc(m.type)}</td>
    <td><code style="font-size:12px;color:var(--main);word-break:break-all;">${esc(m.expr)}</code></td>
    <td title="${esc(m.fields)}">${esc(String(m.fields||'').slice(0,40))}</td></tr>`;
  const metHtml = (title, arr, note) => arr.length
    ? `<div class="panel"><h2>${title} <span style="font-weight:400;font-size:12px;color:var(--sub);margin-left:8px;">${note} · ${arr.length} 个</span></h2>
       <div style="overflow-x:auto;"><table><thead><tr><th>名称</th><th>类型</th><th>计算表达式</th><th>依赖字段</th></tr></thead>
       <tbody>${arr.map(metRow).join('')}</tbody></table></div></div>`
    : '';
  const aggPanel = metHtml('聚合列（指标）', mItems, 'dimMet variety=2') +
                   metHtml('维度列（分组）', dItems, 'dimMet variety=1') +
                   metHtml('模型字段（dimMet 定义）', fItems, 'dimMet variety=0 · DataWind 侧字段定义');

  // 下游图表: 该数据集被哪些图表(dataQuery)引用 + 图表归属仪表盘
  const reps = d.downstream_reports || [];
  const repRow = r => `<tr><td>${esc(r.name)}</td><td>${esc(String(r.report_id))}</td>
    <td>${(r.dashboards||[]).map(x=>esc(x.name)).join('<br>') || '<span style="color:var(--sub)">未挂仪表盘</span>'}</td>
    <td>${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">打开 →</a>` : '-'}</td></tr>`;
  const repPanel = reps.length
    ? `<div class="panel"><h2>下游图表（${reps.length} 个）<span style="font-weight:400;font-size:12px;color:var(--sub);margin-left:8px;">消费该数据集的 DataWind 图表</span></h2>
       <div style="overflow-x:auto;"><table><thead><tr><th>图表名</th><th>图表ID</th><th>所属仪表盘</th><th>跳转</th></tr></thead>
       <tbody>${reps.map(repRow).join('')}</tbody></table></div></div>`
    : '';

  const kv = (k, v) => `<div><div class="k">${k}</div><div class="v">${esc(v)}</div></div>`;

  // 质量状态徽标: 基于最近同步时间(不判断status数值口径)
  const syncBadge = (() => {
    if (!d.last_success_task_time) return '<span class="badge bad" title="该数据集尚未有成功同步记录">未同步</span>';
    let days = NaN;
    try { days = Math.floor((Date.now() - new Date(String(d.last_success_task_time).replace(' ','T')).getTime()) / 864e5); } catch(e) {}
    if (isNaN(days) || days < 0) return '<span class="badge" title="' + esc(d.last_success_task_time) + '">最近同步</span>';
    return days <= 1
      ? '<span class="badge ok" title="' + esc(d.last_success_task_time) + '">同步正常</span>'
      : '<span class="badge warn" title="' + esc(d.last_success_task_time) + '">停滞 ' + days + ' 天</span>';
  })();
  const chgCnt = (d.change_history || []).length;
  const ownerInfo = d.owner_email ? kv('Owner', d.owner_email) : '';

  // 面包屑: 资产目录 / 文件夹路径 / 数据集名 (文件夹可点击回目录定位)
  const folderCrumb = d.folder_path
    ? `<a href="javascript:void(0)" onclick="goFolder(${JSON.stringify(d.folder_path)}, ${JSON.stringify((d.folder_path||'').split('/').pop()||'')})">${esc(d.folder_path)}</a>`
    : '<span>未归档/根目录</span>';

  $('main').innerHTML = `
    <div class="back-bar">
      <a class="back" href="/">← 资产目录</a>
      <span class="crumb"><a href="/">资产目录</a> / ${folderCrumb} / <b>${esc(d.name)}</b></span>
    </div>
    <div class="panel"><h2>基本信息 <span style="font-weight:400;font-size:12px;color:var(--sub);margin-left:8px;">${syncBadge}</span></h2>
      <div class="kv">
        ${kv('数据集ID', d.dataset_id)}${kv('名称', d.name)}${kv('文件夹', d.folder_path)}
        ${ownerInfo}
        ${kv('类型', d.type_name)}${kv('调度频率', d.frequency)}${kv('调度时间', d.schedule_time)}
        ${kv('状态', d.status)}${kv('行数(上次成功)', d.rows_cnt)}${kv('上次同步', d.last_success_task_time)}
        ${kv('创建时间', d.ctime)}${kv('修改时间', d.mtime)}${kv('同步方式', d.sync_type)}
        ${kv('连接模式', d.connection_mode)}${kv('密级', d.confidentiality)}
        ${d.data_source_type ? kv('数据源', `${d.data_source_type}${d.cluster_name ? ' · ' + d.cluster_name : ''}${d.data_source_id ? ' (ID ' + d.data_source_id + ')' : ''}`) : ''}
        ${d.source_db ? kv('数据源库', d.source_db) : ''}
      </div>
    </div>
    <div class="panel"><h2>表级血缘（上下游依赖）</h2>
      <div class="legend">
        <span>节点分层:</span>
        <span class="item"><span class="dot" style="background:#2b6cb0"></span>mv</span>
        <span class="item"><span class="dot" style="background:#2f855a"></span>ods</span>
        <span class="item"><span class="dot" style="background:#805ad5"></span>dwd</span>
        <span class="item"><span class="dot" style="background:#319795"></span>dim</span>
        <span class="item"><span class="dot" style="background:#c05621"></span>dws</span>
        <span class="item"><span class="dot" style="background:#c53030"></span>ads</span>
        <span class="item"><span class="dot round" style="background:#d97706"></span>数据集</span>
        <span class="tips" style="margin-left:auto">点击表节点可查看完整血缘 →</span>
      </div>
      <div id="lineage-svg-wrap">${treeSvg}</div>
    </div>
    <div class="panel"><h2>字段级血缘（${fl.length} 条）</h2>
      <div style="overflow-x:auto;"><table><thead><tr><th>目标字段</th><th>来源表</th><th>来源字段</th><th>置信度</th></tr></thead>
      <tbody>${flRows}</tbody></table></div>
    </div>
    <div class="panel"><h2>字段清单</h2>
      <div style="overflow-x:auto;"><table><thead><tr><th>字段名</th><th>业务列</th><th>类型</th></tr></thead>
      <tbody>${flds}</tbody></table></div>
    </div>
    <div class="panel"><h2>加工 SQL</h2><pre>${esc(d.sql_logic || '（无加工SQL / 直连）')}</pre></div>
    ${aggPanel}
    ${repPanel}
    <div class="panel"><h2>变更时间线 <span style="font-weight:400;font-size:12px;color:var(--sub);margin-left:8px;">近 ${chgCnt} 条 · 按检测日分组</span></h2>${ch}</div>`;

  // 更新当前选中态 + URL(便于刷新/分享)
  curDsid = dsid;
  const p = '/dataset/' + dsid;
  if (location.pathname !== p) history.pushState(null, '', p);
  $('title').textContent = `${esc(d.name)} (${d.dataset_id})`;
  // 刷新左侧树高亮
  renderTree();
  if ($('searchRes').style.display !== 'none') doSearch();
}

// 浏览器前进/后退时按 URL 切换详情
window.addEventListener('popstate', () => {
  const id = getDsid();
  if (id && id !== curDsid) loadDetail(id);
});

// 面包屑点击文件夹 -> 回资产目录并定位到该文件夹(复用 index 的目录状态记忆)
function goFolder(path, name){
  try {
    sessionStorage.setItem('assetCatalogState', JSON.stringify({
      mode: 'folder', kw: '', layerSel: '', dbSel: '',
      folderSel: path, folderName: name,
      dsType: '', dsStatus: '', dsSource: '', dsFreq: '', page: 1
    }));
  } catch (e) { /* 忽略 */ }
  location.href = '/';
}

loadTrees();
loadDetail(getDsid());
</script>
