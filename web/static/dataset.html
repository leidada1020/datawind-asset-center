<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据集详情 - DataWind 资产中心</title>
<style>
:root{--main:#1a6d8a;--bg:#f5f7fa;--card:#fff;--line:#e2e8f0;--text:#1f2329;--sub:#646a73;--accent:#d97706;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);}
header{background:#fff;border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:24px;}
header h1{font-size:18px;color:var(--main);}
header nav a{color:var(--sub);text-decoration:none;margin-right:16px;font-size:14px;}
header nav a:hover{color:var(--main);}
header .dt{font-size:13px;color:var(--sub);margin-left:auto;}
main{padding:20px 24px;max-width:1440px;margin:0 auto;}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 20px;margin-bottom:20px;}
.panel h2{font-size:15px;margin-bottom:12px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{background:#f0f4f7;color:var(--sub);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
pre{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:8px;font-size:12px;overflow-x:auto;white-space:pre-wrap;word-break:break-all;}
.conf{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;}
.conf.high{background:#e6f4ea;color:#1a7f37;}
.conf.medium{background:#fdf0e3;color:#b45309;}
.conf.pending{background:#f0f4f7;color:#64748b;}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;font-size:13px;}
.kv .k{color:var(--sub);font-size:12px;}
.kv .v{font-weight:500;word-break:break-all;}
.hops{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:13px;}
.node{background:#e8f0f4;border:1px solid #c6d8e2;border-radius:6px;padding:8px 12px;}
.node.ds{background:#fdf0e3;border-color:#e5c9a5;}
.node .db{color:var(--sub);font-size:11px;}
svg{width:100%;height:auto;}
.changes li{list-style:none;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px;}
.changes .t{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;margin-right:8px;background:#e8f0f4;color:var(--main);}
.changes .t.added{background:#e6f4ea;color:#1a7f37;}
.changes .t.deleted{background:#fde8e8;color:#c0392b;}
.changes .t.config_changed{background:#fdf0e3;color:#b45309;}
.changes .t.mtime_changed{background:#e8e8fd;color:#4c46b8;}
.changes .t.upstream_changed{background:#e0f2fe;color:#0369a1;}
.changes .t.data_synced,.changes .t.rows_changed{background:#f0f4f7;color:#475569;}
a{color:var(--main);text-decoration:none;} a:hover{text-decoration:underline;}
</style>
</head>
<body>
<header>
  <h1>DataWind 资产中心</h1>
  <nav><a href="/">资产目录</a><a href="/lineage">血缘查询</a><a href="/changes">变更监控</a></nav>
  <span class="dt" id="title"></span>
</header>
<main id="main"><div class="panel empty" style="text-align:center;color:var(--sub);padding:40px;">加载中...</div></main>

<script>
const $ = id => document.getElementById(id);
const dsid = parseInt(location.pathname.split('/')[2]);
function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function j(url){ const r = await fetch(url); return r.json(); }

async function load(){
  const d = await j('/api/datasets/' + dsid);
  if (d.error){ $('main').innerHTML = `<div class="panel empty">${esc(d.error)}</div>`; $('title').textContent = d.error; return; }
  $('title').textContent = `${esc(d.name)} (${d.dataset_id})`;

  // 上游表血缘图(内联SVG): 数据集 <- 上游表
  const ups = d.upstream_tables || [];
  let svg = '';
  if (ups.length){
    const W = 900, H = 70 + Math.ceil(ups.length / 5) * 86;
    const perRow = 5;
    let boxes = '';
    ups.forEach((u, i) => {
      const col = i % perRow, row = Math.floor(i / perRow);
      const x = 40 + col * 172, y = 20 + row * 86;
      boxes += `<g><rect x="${x}" y="${y}" width="150" height="52" rx="6" fill="#e8f0f4" stroke="#c6d8e2"/>
        <text x="${x+75}" y="${y+22}" text-anchor="middle" font-size="11" fill="#1a6d8a">${esc(u.table)}</text>
        <text x="${x+75}" y="${y+40}" text-anchor="middle" font-size="10" fill="#646a73">${esc(u.db || '-')} · hop ${u.hop}</text></g>`;
    });
    const lastRow = Math.floor((ups.length - 1) / perRow);
    const dsY = 20 + (lastRow + 1) * 86;
    svg = `<svg viewBox="0 0 ${W} ${dsY + 86}" xmlns="http://www.w3.org/2000/svg">
      ${boxes}
      <g><rect x="360" y="${dsY}" width="180" height="60" rx="8" fill="#fdf0e3" stroke="#e5c9a5"/>
        <text x="450" y="${dsY+24}" text-anchor="middle" font-size="12" font-weight="600" fill="#b45309">${esc(d.name)}</text>
        <text x="450" y="${dsY+44}" text-anchor="middle" font-size="10" fill="#646a73">数据集 ${d.dataset_id}</text></g>
      <text x="30" y="${dsY-16}" font-size="12" fill="#646a73">${ups.length} 个上游来源表</text>
      <text x="${W-200}" y="${dsY+76}" font-size="10" fill="#94a3b8">表级血缘（hop=1, 闭包预计算）</text>
    </svg>`;
  } else {
    svg = `<div class="empty">该数据集无解析到的上游表（直连/无加工SQL）</div>`;
  }

  // 字段级血缘表
  const fl = d.field_lineage || [];
  const flRows = fl.map(f => `<tr><td>${esc(f.target)}</td><td>${esc(f.src_table)}</td><td>${esc(f.src_field)}</td>
    <td><span class="conf ${f.conf}">${f.conf}</span></td></tr>`).join('') ||
    '<tr><td colspan="4" class="empty">无字段级血缘</td></tr>';

  // 字段清单
  const flds = (d.fields || []).map(f => `<tr><td>${esc(f.name)}</td><td>${esc(f.business)}</td><td>${esc(f.type)}</td></tr>`).join('') ||
    '<tr><td colspan="3" class="empty">无字段清单（直连数据集）</td></tr>';

  // 变更历史
  const ch = (d.change_history || []).map(c => `<li>
    <span class="t ${c.type}">${esc(c.type_name)}</span>
    <span style="color:var(--sub)">${esc(c.dt)}</span>
    ${c.fields ? '字段: ' + esc(c.fields) : ''}
    ${c.remark ? '<span style="color:var(--sub)">(' + esc(c.remark) + ')</span>' : ''}
  </li>`).join('') || '<li class="empty">暂无变更历史</li>';

  const kv = (k, v) => `<div><div class="k">${k}</div><div class="v">${esc(v)}</div></div>`;

  $('main').innerHTML = `
    <div class="panel"><h2>基本信息</h2>
      <div class="kv">
        ${kv('数据集ID', d.dataset_id)}${kv('名称', d.name)}${kv('文件夹', d.folder_path)}
        ${kv('类型', d.type_name)}${kv('调度频率', d.frequency)}${kv('调度时间', d.schedule_time)}
        ${kv('状态', d.status)}${kv('行数(上次成功)', d.rows_cnt)}${kv('上次同步', d.last_success_task_time)}
        ${kv('创建时间', d.ctime)}${kv('修改时间', d.mtime)}${kv('同步方式', d.sync_type)}
        ${kv('连接模式', d.connection_mode)}${kv('密级', d.confidentiality)}
      </div>
    </div>
    <div class="panel"><h2>表级血缘（上游来源）</h2>${svg}</div>
    <div class="panel"><h2>字段级血缘（${fl.length} 条）</h2>
      <div style="overflow-x:auto;"><table><thead><tr><th>目标字段</th><th>来源表</th><th>来源字段</th><th>置信度</th></tr></thead>
      <tbody>${flRows}</tbody></table></div>
    </div>
    <div class="panel"><h2>字段清单</h2>
      <div style="overflow-x:auto;"><table><thead><tr><th>字段名</th><th>业务列</th><th>类型</th></tr></thead>
      <tbody>${flds}</tbody></table></div>
    </div>
    <div class="panel"><h2>加工 SQL</h2><pre>${esc(d.sql_logic || '（无加工SQL / 直连）')}</pre></div>
    <div class="panel"><h2>变更历史</h2><ul class="changes">${ch}</ul></div>`;
}

load();
</script>
</body>
</html>
